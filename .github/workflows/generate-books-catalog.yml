name: Generate Books Catalog

on:
  release:
    types: [published, created, edited]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate catalog.json from GitHub Releases
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // Fetch releases
            const releases = await github.rest.repos.listReleases({
              owner,
              repo,
              per_page: 100
            });

            const books = [];

            function mapSubject(sub) {
              const s = sub.toLowerCase();
              if (s.includes('neighborhoodsactivities')) return { id: 'biology_act', name: 'الأنشطة والتجارب - الأحياء', icon: '🧬' };
              if (s.includes('neighborhoods') || s.includes('bio')) return { id: 'biology', name: 'الأحياء', icon: '🧬' };
              if (s.includes('chemistryactivities')) return { id: 'chemistry_act', name: 'الأنشطة والتجارب - الكيمياء', icon: '🧪' };
              if (s.includes('chemistry')) return { id: 'chemistry', name: 'الكيمياء', icon: '🧪' };
              if (s.includes('physicsactivities')) return { id: 'physics_act', name: 'الأنشطة والتجارب - الفيزياء', icon: '⚡' };
              if (s.includes('physics') || s.includes('فيز')) return { id: 'physics', name: 'الفيزياء', icon: '⚡' };
              if (s.includes('englishpubils') || s.includes('englishpupils') || s.includes('pupil')) return { id: 'english', name: 'اللغة الإنجليزية (كتاب الطالب)', icon: '🇬🇧' };
              if (s.includes('englishwork') || s.includes('work')) return { id: 'english_work', name: 'اللغة الإنجليزية (كتاب التدريبات)', icon: '🇬🇧' };
              if (s.includes('english') || s.includes('إنجليز') || s.includes('انجليز')) return { id: 'english', name: 'اللغة الإنجليزية', icon: '🇬🇧' };
              if (s.includes('syntax')) return { id: 'syntax', name: 'النحو والصرف والقواعد', icon: '📖' };
              if (s.includes('literature')) return { id: 'literature', name: 'الأدب والنصوص والبلاغة', icon: '📖' };
              if (s.includes('reading')) return { id: 'reading', name: 'القراءة والمطالعة', icon: '📖' };
              if (s.includes('arabic') || s.includes('عرب')) return { id: 'arabic', name: 'اللغة العربية', icon: '📖' };
              if (s.includes('sirprophet') || s.includes('sirah')) return { id: 'sirah', name: 'السيرة النبوية الشريفة', icon: '🕌' };
              if (s.includes('hadith')) return { id: 'hadith', name: 'الحديث الشريف وعلومه', icon: '🕌' };
              if (s.includes('eman')) return { id: 'eman', name: 'الإيمان والتربية الإيمانية', icon: '✨' };
              if (s.includes('quran') || s.includes('قرآن')) return { id: 'quran', name: 'القرآن الكريم وتلاوته', icon: '✨' };
              if (s.includes('islam') || s.includes('إسلام')) return { id: 'islamic', name: 'التربية الإسلامية', icon: '🕌' };
              if (s.includes('nationaleducation') || s.includes('civic')) return { id: 'civics', name: 'التربية الوطنية', icon: '🇾🇪' };
              if (s.includes('ymenisociety') || s.includes('society')) return { id: 'yemen_society', name: 'المجتمع اليمني والقضايا المعاصرة', icon: '🇾🇪' };
              if (s.includes('geographic') || s.includes('geography') || s.includes('جغراف')) return { id: 'geography', name: 'الجغرافيا', icon: '🧭' };
              if (s.includes('history') || s.includes('تاريخ')) return { id: 'history', name: 'التاريخ', icon: '🏛️' };
              if (s.includes('math') || s.includes('رياض')) return { id: 'math', name: 'الرياضيات', icon: '📐' };
              if (s.includes('science') || s.includes('علوم')) return { id: 'science', name: 'العلوم', icon: '🔬' };
              return { id: sub.toLowerCase(), name: sub, icon: '📕' };
            }

            const booksMap = new Map();

            for (const release of releases.data) {
              for (const asset of release.assets) {
                if (!asset.name.toLowerCase().endsWith('.pdf')) continue;
                
                const base = asset.name.replace(/\.pdf$/i, '');
                const parts = base.split(/[-_]/);
                if (parts.length === 0) continue;
                
                const subKey = parts[0].trim();
                const grade = parseInt(parts[1] || '0', 10);
                const part = parts.length > 2 ? parseInt(parts[2] || '0', 10) : null;
                
                const subjInfo = mapSubject(subKey);
                const sizeMb = Math.round((asset.size / (1024 * 1024)) * 10) / 10;
                
                let partLabel = 'كتاب المنهج الكامل';
                if (subKey.toLowerCase().includes('activities')) partLabel = 'الأنشطة والتجارب العملية';
                else if (subKey.toLowerCase().includes('pupil') || subKey.toLowerCase().includes('pubil')) partLabel = 'كتاب الطالب';
                else if (subKey.toLowerCase().includes('work')) partLabel = 'كتاب التدريبات';
                else if (part === 1) partLabel = 'الجزء الأول';
                else if (part === 2) partLabel = 'الجزء الثاني';
                else if (part === 3) partLabel = 'الجزء الثالث';
                else if (part) partLabel = `الجزء ${part}`;

                const uniqueKey = `${grade}_${subjInfo.id}_${part || 0}`;

                const bookObj = {
                  id: `book_${grade}_${subjInfo.id}_${part || 0}`,
                  grade_id: grade,
                  subject_id: subjInfo.id,
                  subject_name: subjInfo.name,
                  subject_icon: subjInfo.icon,
                  title: `كتاب ${subjInfo.name} (${partLabel})`,
                  edition: `إصدار ${release.tag_name || 'الرسمي'}`,
                  part_number: part,
                  asset_name: asset.name,
                  size_bytes: asset.size,
                  size_mb: sizeMb,
                  download_url: asset.browser_download_url,
                  updated_at: asset.updated_at
                };

                // Deduplicate: Keep newest
                if (!booksMap.has(uniqueKey) || new Date(asset.updated_at) > new Date(booksMap.get(uniqueKey).updated_at)) {
                  booksMap.set(uniqueKey, bookObj);
                }
              }
            }

            const books = Array.from(booksMap.values()).sort((a, b) => {
              if (a.grade_id !== b.grade_id) return a.grade_id - b.grade_id;
              if (a.subject_id !== b.subject_id) return a.subject_id.localeCompare(b.subject_id);
              return (a.part_number || 0) - (b.part_number || 0);
            });

            const catalog = {
              version: 1,
              generated_at: new Date().toISOString(),
              total_books: books.length,
              books: books
            };

            fs.writeFileSync('catalog.json', JSON.stringify(catalog, null, 2), 'utf8');
            console.log(`Successfully generated catalog.json with ${books.length} books.`);

      - name: Commit and Push catalog.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add catalog.json
          git commit -m "Auto-generate catalog.json for tanweer-books [skip ci]" || echo "No changes to commit"
          git push origin main || echo "Nothing to push"
