name: Build Android APK

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'server/**'
      - 'docs/**'
      - 'README.md'

  pull_request:

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Tanweer Android
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            **/*.gradle
            **/*.gradle.kts
            **/gradle.properties
            gradle/libs.versions.toml
            gradle/wrapper/gradle-wrapper.properties

      - name: Validate Gradle wrapper
        run: |
          set -euo pipefail

          test -f gradlew
          test -f gradle/wrapper/gradle-wrapper.properties

          chmod +x gradlew

          test -x gradlew

      - name: Show build environment
        run: |
          set -euo pipefail

          java -version
          ./gradlew --version

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace --no-daemon

      # PRs do not have access to repository secrets.
      # Build Debug there so CI still verifies the Android project.
      - name: Assemble Debug APK
        if: github.event_name == 'pull_request'
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      # ------------------------------------------------------------
      # Release signing - main / manual runs only
      # ------------------------------------------------------------

      - name: Prepare release keystore
        if: github.event_name != 'pull_request'
        env:
          MY_KEYSTORE_JKS: ${{ secrets.MY_KEYSTORE_JKS }}
        run: |
          set -euo pipefail

          test -n "$MY_KEYSTORE_JKS" || {
            echo "MY_KEYSTORE_JKS is missing from GitHub Secrets."
            exit 1
          }

          KEYSTORE_FILE="$RUNNER_TEMP/tanweer-release.jks"

          printf '%s' "$MY_KEYSTORE_JKS" | base64 --decode > "$KEYSTORE_FILE"
          chmod 600 "$KEYSTORE_FILE"

          test -s "$KEYSTORE_FILE" || {
            echo "Decoded keystore is empty."
            exit 1
          }

          echo "KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"

      - name: Validate release keystore
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail

          test -n "$KEYSTORE_PASSWORD" || {
            echo "KEYSTORE_PASSWORD is missing."
            exit 1
          }

          test -n "$KEY_ALIAS" || {
            echo "KEY_ALIAS is missing."
            exit 1
          }

          keytool \
            -list \
            -keystore "$KEYSTORE_PATH" \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            >/dev/null

          echo "Keystore and requested alias are valid."

      - name: Assemble signed Release APK
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_PATH: ${{ env.KEYSTORE_PATH }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          test -n "$KEYSTORE_PASSWORD" || {
            echo "KEYSTORE_PASSWORD is missing."
            exit 1
          }

          test -n "$KEY_ALIAS" || {
            echo "KEY_ALIAS is missing."
            exit 1
          }

          test -n "$KEY_PASSWORD" || {
            echo "KEY_PASSWORD is missing."
            exit 1
          }

          ./gradlew clean assembleRelease \
            --stacktrace \
            --no-daemon

      - name: Verify Release APK
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail

          APK_PATH="app/build/outputs/apk/release/app-release.apk"

          test -f "$APK_PATH" || {
            echo "Release APK was not generated."
            exit 1
          }

          test -s "$APK_PATH" || {
            echo "Release APK is empty."
            exit 1
          }

          echo "APK size:"
          du -h "$APK_PATH"

          echo "APK SHA-256:"
          sha256sum "$APK_PATH" | tee app-release.sha256

      - name: Rename Release APK
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail

          mkdir -p artifacts

          cp \
            app/build/outputs/apk/release/app-release.apk \
            "artifacts/Tanweer-${GITHUB_SHA::7}-release.apk"

          cp \
            app-release.sha256 \
            "artifacts/Tanweer-${GITHUB_SHA::7}-release.apk.sha256"

      - name: Upload signed Release APK
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: Tanweer-release-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: Upload Debug APK
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: Tanweer-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
