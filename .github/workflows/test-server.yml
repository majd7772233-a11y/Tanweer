name: Test Tanweer Server

on:
  push:
    paths:
      - 'server/**'
      - '.github/workflows/test-server.yml'

  pull_request:
    paths:
      - 'server/**'
      - '.github/workflows/test-server.yml'

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: server-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck + Tests + Wrangler Validation
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: ./server

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Show Node environment
        run: |
          node --version
          npm --version

      - name: Validate package metadata
        run: |
          test -f package.json
          test -f package-lock.json
          test -f tsconfig.json
          test -f wrangler.jsonc

      - name: Install dependencies
        run: npm ci

      - name: Report npm dependency advisories (informational)
        continue-on-error: true
        run: |
          npm audit --json > npm-audit-report.json || true
          node <<'NODE'
          const fs = require('node:fs');

          let report;
          try {
            report = JSON.parse(fs.readFileSync('npm-audit-report.json', 'utf8'));
          } catch (error) {
            console.error('npm audit did not return a readable JSON report:', error.message);
            process.exit(0);
          }

          const counts = report.metadata?.vulnerabilities ?? {};
          console.log('npm audit vulnerability totals:', JSON.stringify(counts));

          const rank = { critical: 0, high: 1, moderate: 2, low: 3, info: 4 };
          const entries = Object.entries(report.vulnerabilities ?? {})
            .sort((a, b) => (rank[a[1].severity] ?? 9) - (rank[b[1].severity] ?? 9) || a[0].localeCompare(b[0]));

          for (const [name, vulnerability] of entries) {
            console.log(
              [
                `PACKAGE=${name}`,
                `SEVERITY=${vulnerability.severity}`,
                `DIRECT=${vulnerability.isDirect}`,
                `RANGE=${vulnerability.range}`,
                `FIX=${JSON.stringify(vulnerability.fixAvailable ?? null)}`,
                `NODES=${(vulnerability.nodes ?? []).join(',')}`
              ].join(' | ')
            );

            for (const advisory of vulnerability.via ?? []) {
              if (typeof advisory === 'string') {
                console.log(`  VIA_DEPENDENCY=${advisory}`);
              } else {
                console.log(
                  `  VIA_ADVISORY=${advisory.title ?? 'Untitled'} | URL=${advisory.url ?? 'n/a'} | RANGE=${advisory.range ?? 'n/a'}`
                );
              }
            }
          }

          if (entries.length === 0) {
            console.log('npm audit reported no vulnerable packages.');
          }
          NODE
          rm -f npm-audit-report.json

      - name: Typecheck
        run: npm run types

      - name: Run unit and integration tests
        run: npm test -- --reporter=verbose

      # No deployment here.
      # This validates Worker bundling/configuration only.
      - name: Validate Wrangler production bundle
        run: |
          ./node_modules/.bin/wrangler deploy --dry-run
          ./node_modules/.bin/wrangler deploy --dry-run --env staging

      - name: Show migration files
        run: |
          echo "Available D1 migrations:"
          find src/db/migrations -maxdepth 1 -type f -name '*.sql' | sort